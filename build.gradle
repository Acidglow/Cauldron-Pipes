plugins {
    id "net.neoforged.gradle.userdev" version "7.1.38"
}

apply plugin: "java-library"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = rootProject.archives_base_name
}
version = rootProject.mod_version
group = rootProject.mod_group_id

accessTransformers {
    file "src/main/resources/META-INF/accesstransformer.cfg"
}

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"

        modSource project.sourceSets.main
    }

    client {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }

    server {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        argument "--nogui"
    }

    gameTestServer {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }

}

sourceSets.main.resources { srcDir "src/generated/resources" }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license, mod_homepage: mod_homepage, mod_issues: mod_issues,
        neo_version: neo_version, neo_version_range: neo_version_range
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("jar") {
    manifest {
        attributes "MixinConfigs": "cauldron_pipes.mixins.json"
    }
}

// NeoForm 26.1: apply user AT directly on rename output.
afterEvaluate {
    def renameTask = tasks.findByName("neoFormRename")
    def applyUserTask = tasks.findByName("neoFormApplyUserAccessTransformer")
    if (renameTask != null && applyUserTask != null) {
        def renameOutput = renameTask.outputs.files.singleFile
        applyUserTask.inputFile.set(renameOutput)
        applyUserTask.dependsOn(renameTask)
    }
}
