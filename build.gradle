plugins {
    id "net.neoforged.gradle.userdev" version "7.1.20"
}

apply plugin: "java-library"
apply plugin: "maven-publish"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

base {
    archivesName = rootProject.archives_base_name
}
version = "${rootProject.mc_version}-${rootProject.mod_version}"
group = rootProject.maven_group

repositories {
    maven {
        name = "JEI"
        url = "https://dvs1.progwml6.com/files/maven"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
    }
}

accessTransformers {
    file "src/main/resources/META-INF/accesstransformer.cfg"
}

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"

        modSource project.sourceSets.main
    }

    client {
        systemProperty "forge.enabledGameTestNamespaces", project.mod_id
    }

    server {
        systemProperty "forge.enabledGameTestNamespaces", project.mod_id
        arguments '--nogui'
    }

    gameTestServer {
        systemProperty "forge.enabledGameTestNamespaces", project.mod_id
    }

}

sourceSets.main.resources { srcDir "src/generated/resources" }

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_api_version}"
	implementation "curse.maven:pipez-443900:${pipez_file}"
}

tasks.withType(ProcessResources).configureEach {
    var resourceTargets = ["META-INF/neoforge.mods.toml", "*.json"]
    var intoTargets = ["$rootDir/out/production/resources/", "$rootDir/out/production/${project.name}.main/", "$rootDir/bin/main/"]
    var replaceProperties = [mc_version: mc_version,
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license, mod_homepage: mod_homepage, mod_source: mod_source, mod_issues: mod_issues,
        neoforge_api_version: neoforge_api_version, neoforge_api_version_range: neoforge_api_version_range, neoforge_loader_version: neoforge_loader_version
    ]
    inputs.properties replaceProperties

    filesMatching(resourceTargets) {
        expand replaceProperties + [project: project]
    }

    intoTargets.each { target ->
        if (file(target).exists()) {
            copy {
                from(sourceSets.main.resources) {
                    include resourceTargets
                    expand replaceProperties
                }
                into target
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("jar") {
    manifest {
        attributes "MixinConfigs": "cauldron_pipes.mixins.json"
    }
}

// NeoForm 21.11 beta: apply user AT directly on rename output.
afterEvaluate {
    def renameTask = tasks.findByName("neoFormRename")
    def applyUserTask = tasks.findByName("neoFormApplyUserAccessTransformer")
    if (renameTask != null && applyUserTask != null) {
        def renameOutput = renameTask.outputs.files.singleFile
        applyUserTask.inputFile.set(renameOutput)
        applyUserTask.dependsOn(renameTask)
    }
}
